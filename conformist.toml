# conformist configuration (treefmt successor): the goimports -> gofumpt ->
# nixfmt -> rustfmt -> shfmt formatter chain that produces this repo's
# canonical formatting, plus linters conformist runs natively (shellcheck).
# Run via `conformist` (repair) / `conformist check`. Wired as the flake
# `formatter` and gated by `just lint-fmt`.

# Generated / locked / prose / hand-formatted — not formatted.
excludes = [
  "flake.lock",
  "go.sum",
  "Cargo.lock",
  "gomod2nix.toml",
  "version.env",
  "LICENSE",
  "*.md",
  "result",
  "result-*",
  ".tmp/**",
  # conformist's own config is TOML with intentional layout; leave it be.
  "conformist.toml",
]

# Go: goimports (priority 1) must run before gofumpt (priority 2) so the
# import-grouped output is re-canonicalized by gofumpt. -w so each writes in
# place (required for conformist's sandbox check to observe drift).
[formatter.goimports]
command = "goimports"
options = ["-w"]
includes = ["*.go"]
priority = 1

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]
priority = 2

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

# Rust: rustfmt directly on files (not `cargo fmt` — conformist passes file
# arguments). skip_children + explicit edition mirror eng's global config;
# rust-crap is edition 2024.
[formatter.rustfmt]
command = "rustfmt"
options = ["--config", "skip_children=true", "--edition", "2024"]
includes = ["*.rs"]

# Project shell style: 2-space indent, simplify, case-branch indent. -w
# writes. No shell files exist today; this future-proofs the planned
# ndjson-crap bats suite reintroduction.
[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "2", "-s", "-ci"]
includes = ["*.sh", "*.bash", "*.bats"]

# Linter: shellcheck runs read-only in `conformist check` (no autofix).
[linter.shellcheck]
command = "shellcheck"
includes = ["*.sh", "*.bash", "*.bats"]
